<!DOCTYPE html>
<html>

<head>
    <style>
        div.gallery {
            margin: 5px;
            border: 1px solid #ccc;
            float: left;
            width: 180px;
        }

        div.gallery:hover {
            border: 1px solid #777;
        }

        div.gallery img {
            width: 100%;
            height: auto;
        }

        div.desc {
            padding: 15px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="gallery">
        <a target="_blank"
            href="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=85">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=600&q=80"
                alt="Cinque Terre" width="600" height="400">
        </a>
        <div class="desc">A peaceful coastal escape with colorful villages tucked between the hills and sea.</div>
    </div>
    <div class="gallery">
        <a target="_blank"
            href="https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1200&q=85">
            <img src="https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=600&q=80"
                alt="Forest" width="600" height="400">
        </a>
        <div class="desc">A quiet forest trail surrounded by towering trees and fresh green leaves.</div>
    </div>
    <div class="gallery">
        <a target="_blank"
            href="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=1200&q=85">
            <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=600&q=80"
                alt="Northern Lights" width="600" height="400">
        </a>
        <div class="desc">Golden evening light spills across a dreamy landscape at sunset.</div>
    </div>
    <div class="gallery">
        <a target="_blank"
            href="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1200&q=85">
            <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=600&q=80"
                alt="Mountains" width="600" height="400">
        </a>
        <div class="desc">Snow-covered mountain peaks glow beneath a star-filled night sky.</div>
    </div>
</body>

</html>
